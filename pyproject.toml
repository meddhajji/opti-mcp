[project]
name = "optimizer-mcp"
version = "0.1.0"
description = "Exact optimisation tools for coding agents: solve, verify, explain conflicts, schedule staff"
requires-python = ">=3.10"
dynamic = ["dependencies"]  # read from requirements.txt, which the plugin launcher also uses

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
optimizer-mcp = "optimizer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["optimizer"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
