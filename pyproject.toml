[project]
name = "optimizer-mcp"
version = "0.3.0"
description = "Exact optimisation for agents: standard problem kinds solved, proved optimal and verified, as an MCP server or a library"
requires-python = ">=3.10"
dynamic = ["dependencies"]  # read from requirements.txt, which the plugin launcher also uses

[project.optional-dependencies]
# groq and google-genai: benchmark harness for weaker models only, never the plugin
dev = ["pytest>=8.0", "groq>=1.7", "google-genai>=2.30"]

[project.scripts]
optimizer-mcp = "optimizer.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["optimizer"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
