[project]
name = "optimizer-mcp"
version = "0.4.0"
description = "An MCP server that lets cheap and open-source LLMs solve optimisation problems exactly: proved optimal, independently verified"
requires-python = ">=3.10"
dynamic = ["dependencies"]  # read from requirements.txt, which the Docker image also installs

[project.optional-dependencies]
# groq and google-genai: benchmark harness for the models under test only, never the server
dev = ["pytest>=8.0", "groq>=1.7", "google-genai>=2.30"]

[project.scripts]
optimizer-mcp = "optimizer.server:main"   # MCP over stdio
optimizer-web = "optimizer.web:main"      # MCP over HTTP plus JSON endpoints

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["optimizer"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
